<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" style="background: #ffffff;">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" fill="#495057">
      <polygon points="0 0, 8 3, 0 6" />
    </marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
    </style>
  </defs>

  <!-- Pillar Content box (top center) -->
  <rect x="340" y="20" width="220" height="80" rx="8" ry="8" fill="#d0bfff" stroke="#7048e8" stroke-width="3" />
  <text x="450" y="52" text-anchor="middle" font-size="18" font-weight="bold" fill="#5f3dc4">Pillar Content</text>
  <text x="450" y="74" text-anchor="middle" font-size="12" fill="#7048e8">Longform, dense, cornerstone</text>

  <!-- Vertical line from pillar box down to bus -->
  <line x1="450" y1="100" x2="450" y2="140" stroke="#495057" stroke-width="2" />

  <!-- Horizontal bus line -->
  <line x1="75" y1="140" x2="825" y2="140" stroke="#495057" stroke-width="2" />

  <!-- Branch 1: Reels (x=75) -->
  <line x1="75" y1="140" x2="75" y2="180" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)" />
  <rect x="15" y="185" width="120" height="50" rx="8" ry="8" fill="#ffc9c9" stroke="#e03131" stroke-width="2" />
  <text x="75" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#c92a2a">Reels</text>

  <!-- Branch 2: IG Posts (x=225) -->
  <line x1="225" y1="140" x2="225" y2="180" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)" />
  <rect x="165" y="185" width="120" height="50" rx="8" ry="8" fill="#ffd8a8" stroke="#e8590c" stroke-width="2" />
  <text x="225" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#d9480f">IG Posts</text>

  <!-- Branch 3: LI Posts (x=375) -->
  <line x1="375" y1="140" x2="375" y2="180" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)" />
  <rect x="315" y="185" width="120" height="50" rx="8" ry="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2" />
  <text x="375" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#1864ab">LI Posts</text>

  <!-- Branch 4: Podcasts (x=525) -->
  <line x1="525" y1="140" x2="525" y2="180" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)" />
  <rect x="465" y="185" width="120" height="50" rx="8" ry="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2" />
  <text x="525" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b8a3e">Podcasts</text>

  <!-- Branch 5: Blog Posts (x=675) -->
  <line x1="675" y1="140" x2="675" y2="180" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)" />
  <rect x="615" y="185" width="120" height="50" rx="8" ry="8" fill="#ffec99" stroke="#f08c00" stroke-width="2" />
  <text x="675" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#e67700">Blog Posts</text>

  <!-- Branch 6: YT Scripts (x=825) -->
  <line x1="825" y1="140" x2="825" y2="180" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)" />
  <rect x="765" y="185" width="120" height="50" rx="8" ry="8" fill="#e599f7" stroke="#9c36b5" stroke-width="2" />
  <text x="825" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#862e9c">YT Scripts</text>

  <!-- Annotation text -->
  <text x="450" y="280" text-anchor="middle" font-size="14" fill="#868e96" font-style="italic">1 pillar → dozens of content pieces across every platform</text>
</svg>