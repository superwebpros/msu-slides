<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
  </style>

  <rect width="900" height="280" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5"
            markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#495057"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 7" refX="10" refY="3.5"
            markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e03131"/>
    </marker>
  </defs>

  <!-- PIPELINE 1 LABEL -->
  <text x="30" y="18" font-size="12" font-weight="bold" fill="#868e96">PIPELINE 1: SYNTHESIS</text>

  <!-- Box 1: Pillar -->
  <rect x="30" y="30" width="110" height="45" rx="6" fill="#a5d8ff" stroke="#1971c2" stroke-width="1.5"/>
  <text x="85" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Pillar</text>
  <text x="85" y="90" text-anchor="middle" font-size="11" fill="#868e96">Baserow</text>

  <line x1="140" y1="52" x2="168" y2="52" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 2: Sources -->
  <rect x="175" y="30" width="110" height="45" rx="6" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/>
  <text x="230" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Sources</text>
  <text x="230" y="90" text-anchor="middle" font-size="11" fill="#868e96">3-5 URLs</text>

  <line x1="285" y1="52" x2="313" y2="52" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 3: NotebookLM -->
  <rect x="320" y="30" width="120" height="45" rx="6" fill="#b2f2bb" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="380" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">NotebookLM</text>
  <text x="380" y="90" text-anchor="middle" font-size="11" fill="#868e96">Audio Overview</text>

  <line x1="440" y1="52" x2="468" y2="52" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="454" y="44" text-anchor="middle" font-size="10" font-style="italic" fill="#868e96">audio</text>

  <!-- Box 4: SuperScribe -->
  <rect x="475" y="30" width="110" height="45" rx="6" fill="#ffd8a8" stroke="#e8590c" stroke-width="1.5"/>
  <text x="530" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">SuperScribe</text>
  <text x="530" y="90" text-anchor="middle" font-size="11" fill="#868e96">Transcribe</text>

  <line x1="585" y1="52" x2="613" y2="52" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="599" y="44" text-anchor="middle" font-size="10" font-style="italic" fill="#868e96">text</text>

  <!-- Box 5: Transcript -->
  <rect x="620" y="30" width="110" height="45" rx="6" fill="#ffec99" stroke="#f08c00" stroke-width="2"/>
  <text x="675" y="57" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Transcript</text>
  <text x="675" y="90" text-anchor="middle" font-size="11" fill="#868e96">2-3K words</text>

  <!-- PIPELINE 2 LABEL -->
  <text x="30" y="148" font-size="12" font-weight="bold" fill="#868e96">PIPELINE 2: DECOMPOSITION (Interactive)</text>

  <!-- Box 6: Transcript -->
  <rect x="30" y="160" width="110" height="45" rx="6" fill="#ffec99" stroke="#f08c00" stroke-width="2"/>
  <text x="85" y="187" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Transcript</text>

  <line x1="140" y1="182" x2="188" y2="182" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 7: Scripting -->
  <rect x="195" y="160" width="120" height="45" rx="6" fill="#ffc9c9" stroke="#e03131" stroke-width="1.5"/>
  <text x="255" y="187" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Scripting</text>
  <text x="255" y="220" text-anchor="middle" font-size="11" fill="#868e96">LibreChat prompt</text>

  <!-- Forward arrow: Scripting → Editing -->
  <line x1="315" y1="175" x2="383" y2="175" stroke="#e03131" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Box 8: Editing -->
  <rect x="390" y="160" width="120" height="45" rx="6" fill="#ffc9c9" stroke="#e03131" stroke-width="1.5"/>
  <text x="450" y="187" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Editing</text>
  <text x="450" y="220" text-anchor="middle" font-size="11" fill="#868e96">Review + push back</text>

  <!-- Return arrow: Editing → Scripting (loop) -->
  <path d="M 420,160 L 420,138 L 275,138 L 275,160" fill="none" stroke="#e03131" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>
  <text x="348" y="133" text-anchor="middle" font-size="10" font-style="italic" fill="#e03131">iterate</text>

  <!-- Arrow: Editing → Baserow -->
  <line x1="510" y1="182" x2="558" y2="182" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 9: Baserow -->
  <rect x="565" y="160" width="110" height="45" rx="6" fill="#d0bfff" stroke="#7048e8" stroke-width="1.5"/>
  <text x="620" y="187" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Baserow</text>
  <text x="620" y="220" text-anchor="middle" font-size="11" fill="#868e96">via MCP</text>

  <!-- Annotation -->
  <text x="450" y="268" text-anchor="middle" font-size="12" fill="#868e96" font-style="italic">The loop between Scripting and Editing is the human-in-the-loop — you steer until quality is right</text>
</svg>