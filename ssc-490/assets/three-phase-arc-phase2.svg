<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 280" width="950" height="280" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7048e8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#7048e8" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="950" height="280" fill="#ffffff"/>

  <!-- Phase 1: Interactive (dimmed) -->
  <rect x="60" y="30" width="220" height="70" rx="14" ry="14" fill="#e9ecef" stroke="#adb5bd" stroke-width="2"/>
  <text x="170" y="58" text-anchor="middle" font-size="18" font-weight="bold" fill="#868e96">INTERACTIVE</text>
  <text x="170" y="78" text-anchor="middle" font-size="13" font-style="italic" fill="#adb5bd">Session 16 &#x2713;</text>
  <text x="170" y="122" text-anchor="middle" font-size="13" fill="#adb5bd">You: Steer every step</text>
  <text x="170" y="140" text-anchor="middle" font-size="13" fill="#ced4da">AI: Generates on demand</text>

  <!-- Arrow 1→2 -->
  <polygon points="290,55 290,75 340,75 340,80 370,65 340,50 340,55" fill="#888"/>

  <!-- Phase 2: Agent (HIGHLIGHTED) -->
  <rect x="380" y="25" width="225" height="80" rx="14" ry="14" fill="#a5d8ff" stroke="#1971c2" stroke-width="4"/>
  <text x="492" y="55" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">AGENT</text>
  <text x="492" y="78" text-anchor="middle" font-size="14" font-style="italic" fill="#1971c2">Session 17 (Today)</text>
  <text x="492" y="127" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">You: Set rules, delegate</text>
  <text x="492" y="145" text-anchor="middle" font-size="13" fill="#777">AI: Reads pillars, writes reels</text>

  <!-- Arrow 2→3 -->
  <polygon points="615,55 615,75 660,75 660,80 690,65 660,50 660,55" fill="#888"/>

  <!-- Phase 3: Automated Chain (dimmed) -->
  <rect x="700" y="30" width="220" height="70" rx="14" ry="14" fill="#e9ecef" stroke="#adb5bd" stroke-width="2"/>
  <text x="810" y="58" text-anchor="middle" font-size="18" font-weight="bold" fill="#868e96">AUTOMATED CHAIN</text>
  <text x="810" y="78" text-anchor="middle" font-size="13" font-style="italic" fill="#adb5bd">Sessions 19–22</text>
  <text x="810" y="122" text-anchor="middle" font-size="13" fill="#adb5bd">You: Monitor, QC</text>
  <text x="810" y="140" text-anchor="middle" font-size="13" fill="#ced4da">AI: Multi-agent batch production</text>

  <!-- AI Autonomy spectrum -->
  <text x="60" y="210" font-size="13" font-weight="bold" fill="#7048e8">AI Autonomy</text>
  <rect x="210" y="197" width="710" height="20" rx="4" ry="4" fill="url(#aiGrad)"/>
  <text x="210" y="232" font-size="11" fill="#aaa">less autonomous</text>
  <text x="920" y="232" text-anchor="end" font-size="11" fill="#aaa">more autonomous</text>
</svg>