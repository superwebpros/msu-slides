<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Session 20: The Build Plan - SSC 490</title>

	<link rel="stylesheet" href="../dist/reset.css">
	<link rel="stylesheet" href="../dist/reveal.css">
	<link rel="stylesheet" href="../dist/theme/white.css" id="theme">
	<link rel="stylesheet" href="../plugin/highlight/monokai.css">
	<style>
		.reveal .fd-img { display: block; margin: 8px auto 0 auto; max-width: 100%; max-height: 580px; width: auto; height: auto; }
		.reveal .fd-frame { max-height: 540px; }
		.reveal .fd-frame-early { max-height: 440px; }
		.reveal .slides section h2, .reveal .slides section h3 { font-size: 46px; margin-bottom: 12px; }
		.reveal .fd-line { font-size: 22px; line-height: 1.5; margin: 0 auto; }
		.reveal pre { width: 100%; margin: 0; font-size: 14px; box-shadow: none; }
		.reveal pre code { white-space: pre-wrap; max-height: 600px; line-height: 1.4; padding: 12px 14px; }
		.reveal .hljs-ln-code { white-space: pre-wrap; word-break: break-word; }
		.reveal .hljs-ln-numbers { white-space: nowrap; word-break: keep-all; min-width: 2.2em; vertical-align: top; }
		.reveal .api-grid > div { min-width: 0; }
		.reveal .jev-check p { line-height: 2.1; }
		.reveal .vocab { font-size: 15px; line-height: 1.5; color: #6b7280; margin: 10px auto 0 auto; max-width: 1200px; }
	</style>
</head>
<body>
	<div class="reveal">
		<div class="slides">
			<!-- Title slide -->
			<section>
				<h2>SSC 490: AI Workflows &amp; Organizational Intelligence</h2>
				<h3>Session 20: The Build Plan</h3>
				<p style="font-size: 20px; color: #6b7280;">Tuesday, November 10</p>
				<p style="font-size: 20px; color: #6b7280;">Instructor: Jesse Flores</p>
			</section>

			<!-- Load markdown content -->
			<section data-markdown="markdown/session-20-build-plan.md"
					 data-separator="^\r?\n---\r?\n$"
					 data-separator-vertical="^\r?\n;;;\r?\n$"
					 data-separator-notes="^Note:">
			</section>
		</div>
	</div>

	<script src="../dist/reveal.js"></script>
	<script src="../plugin/markdown/markdown.js"></script>
	<script src="../plugin/highlight/highlight.js"></script>
	<script src="../plugin/notes/notes.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/reveal.js-mermaid-plugin@2.1.0/plugin/mermaid/mermaid.js"></script>
	<script>
		Reveal.initialize({
			hash: true,
			width: 1280,
			height: 720,
			slideNumber: true,
			plugins: [ RevealMarkdown, RevealHighlight, RevealNotes, RevealMermaid ]
		});
	</script>
</body>
</html>
